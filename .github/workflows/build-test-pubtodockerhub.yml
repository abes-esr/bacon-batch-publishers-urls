name: "build-test-pubtodockerhub"

# IMPORTANT : personnalisez cette variable pour que les images
# de votre application soient pousées sur dockerhub
# dans l'organisation/image docker ayant ce nom
# exemple, si vous indiquez : abesesr/abes-hello
#   alors l'image sera poussée sur https://hub.docker.com/r/abesesr/bacon
env:
  DOCKERHUB_IMAGE_PREFIX: abesesr/bacon

on:
  push:
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:


jobs:
  build-test-pubtodockerhub:
    runs-on: ubuntu-latest
    steps:

      - name: "Checkout source code"
        uses: actions/checkout@v7

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Prepare version from git tags/branchs (batch)"
        id: docker_tag_meta_batch
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE_PREFIX }}
          flavor: |
            suffix=-batch-publishers,onlatest=true

      - name: "Prepare version from git tags/branchs (api)"
        id: docker_tag_meta_api
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE_PREFIX }}
          flavor: |
            suffix=-api-publishers,onlatest=true

      - name: "Login to DockerHub"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Buildx and push batch-image"
        id: push-batch
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) }}
          target: batch-image
          tags: ${{ steps.docker_tag_meta_batch.outputs.tags }}

      - name: "Buildx and push api-image"
        id: push-api
        uses: docker/build-push-action@v7
        with:
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')) }}
          target: api-image
          tags: ${{ steps.docker_tag_meta_api.outputs.tags }}
